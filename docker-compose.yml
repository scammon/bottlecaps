services:
  postgres:
    image: postgres:16-alpine
    container_name: bottlecaps-v2-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=bottlecaps
      - POSTGRES_USER=bottlecaps
      - POSTGRES_PASSWORD=bottlecaps_dev_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    # Not published to the host -- only the app container talks to it.

  # Declared before huckleberry -- Dailey OS picks the first non-managed
  # service in this file as the "primary" web process for the project's
  # public URL/ingress, and app (not the huckleberry sidecar) needs to be it.
  app:
    build: ./app
    container_name: bottlecaps-v2-app
    restart: unless-stopped
    depends_on:
      - postgres
      - huckleberry
    env_file:
      - ./app.env
    environment:
      - DATABASE_URL=postgresql://bottlecaps:bottlecaps_dev_only@postgres:5432/bottlecaps
      - PORT=3000
      - BOTTLE_TIMER_MS=3600000
      - EXPIRY_POLL_MS=15000
      - HUCKLEBERRY_URL=http://huckleberry:8080
      - DAILEY_APP_ID=f726ab8a-035b-4655-985e-3522a3ff5bea
    ports:
      # Offset from production's 3000 so both stacks run side by side on mini.
      - "3001:3000"

  huckleberry:
    build: ./huckleberry
    container_name: bottlecaps-v2-huckleberry
    restart: unless-stopped
    # No huckleberry.env anymore -- credentials are per-user now, passed
    # per-request from the app (see huckleberry/app.py).
    # Declares the port so Dailey OS's compose-to-processes synthesizer can
    # wire internal routing (see dailey.yaml docs -- a service is only
    # reachable internally if it declares a port). Tried `expose` first
    # (internal-only, no host publish -- the more semantically correct
    # choice for compose) but that alone didn't fix the ECONNREFUSED we
    # were seeing; using `ports` instead in case that's specifically what
    # their synthesizer parses. On mini's own docker-compose stack this
    # still doesn't publish 8080 anywhere reachable from outside the
    # container network -- nothing else on that host binds to it.
    ports:
      - "8080:8080"

volumes:
  postgres_data:
