<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>bottlecaps</title>

<!-- iOS "Add to Home Screen" support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="bottlecaps">
<meta name="theme-color" content="#12141a">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍾</text></svg>">

<style>
  :root {
    color-scheme: dark;
    --bg: #12141a;
    --panel: #1b1e27;
    --accent: #4f8cff;
    --accent-press: #3a6fd6;
    --text: #f0f2f7;
    --muted: #8a90a2;
    --danger: #ff5f6d;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: radial-gradient(circle at top, #1b1e27, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  /* Everything above the fold -- centered in the first screen, exactly like
     before. The history section below is normal flow, so it only comes
     into view on scroll rather than squeezing into (or being centered
     within) that first screen. */
  .hero {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: calc(env(safe-area-inset-top) + 24px) 20px 24px;
    gap: 28px;
  }
  h1 {
    margin: 0;
    font-size: 1.1rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }
  #button {
    width: min(60vw, 260px);
    height: min(60vw, 260px);
    border-radius: 50%;
    border: none;
    background: linear-gradient(145deg, var(--accent), var(--accent-press));
    color: white;
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    box-shadow: 0 12px 30px rgba(79, 140, 255, 0.35), inset 0 -6px 12px rgba(0,0,0,0.2);
    cursor: pointer;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  #button:active {
    transform: scale(0.96);
    box-shadow: 0 6px 16px rgba(79, 140, 255, 0.3), inset 0 -6px 12px rgba(0,0,0,0.25);
  }
  #button.expired {
    background: linear-gradient(145deg, var(--danger), #c93f4b);
    box-shadow: 0 12px 30px rgba(255, 95, 109, 0.35), inset 0 -6px 12px rgba(0,0,0,0.2);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }
  #timer {
    font-variant-numeric: tabular-nums;
    font-size: clamp(2.4rem, 10vw, 3.6rem);
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  #timer.expired { color: var(--danger); }
  #sub {
    color: var(--muted);
    font-size: 0.95rem;
    text-align: center;
    min-height: 1.2em;
  }
  #started-at {
    color: var(--muted);
    font-size: 0.8rem;
    text-align: center;
    min-height: 1.1em;
  }
  #stats {
    color: var(--muted);
    font-size: 0.8rem;
    letter-spacing: 0.04em;
  }
  #notif-banner {
    display: none;
    background: var(--panel);
    border: 1px solid #2b2f3d;
    border-radius: 12px;
    padding: 10px 16px;
    font-size: 0.85rem;
    color: var(--muted);
    text-align: center;
    max-width: 320px;
  }
  #history {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    padding: 0 20px calc(env(safe-area-inset-bottom) + 40px);
  }
  #history h2 {
    margin: 0 0 4px;
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
    text-align: center;
  }
  #avg-gap {
    text-align: center;
    font-size: 1.4rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    margin-bottom: 18px;
  }
  #avg-gap .label {
    display: block;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--muted);
    text-transform: none;
    margin-top: 2px;
  }
  /* History list: div-based rows (not a <table>) so per-row swipe-to-reveal
     transforms are simple and reliable -- CSS transforms on <tr>/<td> are
     inconsistent across browsers, plain flex rows are not. */
  #history-list { font-size: 0.9rem; }
  .hist-header, .hist-row-content {
    display: grid;
    grid-template-columns: 1.3fr 0.7fr 0.9fr 0.9fr;
    gap: 8px;
    align-items: center;
  }
  .hist-header {
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
    padding: 0 0 8px;
    border-bottom: 1px solid #2b2f3d;
  }
  .hist-header > div:not(:first-child), .hist-cell:not(.hist-started) { text-align: right; }
  .hist-row {
    position: relative;
    overflow: hidden;
    border-bottom: 1px solid #20232d;
  }
  .hist-row-actions {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: flex-end;
    align-items: center;
  }
  .hist-edit-btn, .hist-delete-btn {
    height: 100%;
    padding: 0 20px;
    color: white;
    border: none;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
  }
  .hist-edit-btn { background: var(--accent); }
  /* Delete sits further from the row content -- revealed only on a
     further swipe past the Edit button (see wireSwipe's two-stage snap). */
  .hist-delete-btn { background: var(--danger); }
  .hist-row-content {
    position: relative;
    background: var(--bg);
    padding: 10px 0;
    font-variant-numeric: tabular-nums;
    touch-action: pan-y;
  }
  .hist-empty {
    text-align: center;
    color: var(--muted);
    padding: 20px 0;
  }
  .hist-cell.hist-gap { color: var(--muted); }
  .hist-oz-edit {
    background: var(--panel);
    color: var(--text);
    border: 1px solid #2b2f3d;
    border-radius: 6px;
    padding: 2px 4px;
    font-size: 0.85rem;
    font-variant-numeric: tabular-nums;
    width: 100%;
    text-align: right;
  }
  .hb-log-btn {
    background: none;
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 0.72rem;
    font-weight: 600;
    cursor: pointer;
  }
  .hb-log-btn:disabled { opacity: 0.5; cursor: default; }
  .hb-logged-label {
    color: var(--muted);
    font-size: 0.72rem;
  }
  /* Filled (vs. Log's outline) -- signals there's a staged edit waiting to
     be pushed to the real Huckleberry entry. */
  .hb-update-btn {
    background: var(--accent);
    border: 1px solid var(--accent);
    color: white;
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 0.72rem;
    font-weight: 600;
    cursor: pointer;
  }
  .hb-update-btn:disabled { opacity: 0.5; cursor: default; }
  .hist-cell.hist-oz.pending { color: var(--accent); }

  #cancel-button {
    background: none;
    border: 1px solid #3a2b2f;
    color: var(--muted);
    border-radius: 999px;
    padding: 6px 16px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  #cancel-button:active { background: #201519; }
  #cancel-button.hidden { display: none; }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  .modal-backdrop.hidden { display: none; }
  .modal {
    background: var(--panel);
    border: 1px solid #2b2f3d;
    border-radius: 16px;
    padding: 24px;
    max-width: 320px;
    width: 100%;
    text-align: center;
  }
  .modal p {
    margin: 0 0 20px;
    font-size: 1rem;
  }
  .modal-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
  }
  .modal-actions button {
    flex: 1;
    padding: 10px 0;
    border-radius: 10px;
    border: none;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  #modal-keep {
    background: #2b2f3d;
    color: var(--text);
  }
  #modal-discard {
    background: var(--danger);
    color: white;
  }
  #ounces-cancel {
    background: #2b2f3d;
    color: var(--text);
  }
  #ounces-confirm {
    background: var(--accent);
    color: white;
  }
  #delete-keep {
    background: #2b2f3d;
    color: var(--text);
  }
  #delete-confirm {
    background: var(--danger);
    color: white;
  }
  #ounces-modal-input {
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid #2b2f3d;
    border-radius: 10px;
    padding: 12px;
    font-size: 1.4rem;
    text-align: center;
    font-variant-numeric: tabular-nums;
    margin-bottom: 8px;
  }
  #ounces-modal-input.invalid { border-color: var(--danger); }
  #ounces-modal-error {
    color: var(--danger);
    font-size: 0.8rem;
    min-height: 1.2em;
    margin-bottom: 12px;
  }
  #ounces-confirm:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <div class="hero">
    <h1>bottlecaps</h1>
    <div id="timer">--:--:--</div>
    <button id="button">Log a bottle</button>
    <div id="sub"></div>
    <div id="started-at"></div>
    <button id="cancel-button" class="hidden">Cancel this bottle</button>
    <div id="notif-banner">Notifications are blocked. Enable them for this site to get an alert when the timer runs out.</div>
    <div id="stats"></div>
  </div>

  <div id="cancel-modal" class="modal-backdrop hidden">
    <div class="modal">
      <p>Discard this bottle log?</p>
      <div class="modal-actions">
        <button id="modal-keep">Keep it</button>
        <button id="modal-discard">Discard</button>
      </div>
    </div>
  </div>

  <div id="ounces-modal" class="modal-backdrop hidden">
    <div class="modal">
      <p>How many ounces?</p>
      <input id="ounces-modal-input" type="text" inputmode="decimal" placeholder="3.00">
      <div id="ounces-modal-error"></div>
      <div class="modal-actions">
        <button id="ounces-cancel">Cancel</button>
        <button id="ounces-confirm">Log bottle</button>
      </div>
    </div>
  </div>

  <div id="delete-modal" class="modal-backdrop hidden">
    <div class="modal">
      <p>Delete this bottle entry?</p>
      <div class="modal-actions">
        <button id="delete-keep">Keep it</button>
        <button id="delete-confirm">Delete</button>
      </div>
    </div>
  </div>

  <section id="history">
    <div id="avg-gap">--<span class="label">average time between bottles</span></div>
    <h2>Recent bottles</h2>
    <div id="history-list">
      <div class="hist-header">
        <div>Started</div><div>Oz</div><div>Gap</div><div>Huckleberry</div>
      </div>
      <div id="history-body"></div>
    </div>
  </section>

<script>
(function () {
  const $timer = document.getElementById('timer');
  const $button = document.getElementById('button');
  const $sub = document.getElementById('sub');
  const $startedAt = document.getElementById('started-at');
  const $stats = document.getElementById('stats');
  const $notifBanner = document.getElementById('notif-banner');
  const $avgGap = document.getElementById('avg-gap');
  const $historyBody = document.getElementById('history-body');
  const $cancelButton = document.getElementById('cancel-button');
  const $cancelModal = document.getElementById('cancel-modal');
  const $modalKeep = document.getElementById('modal-keep');
  const $modalDiscard = document.getElementById('modal-discard');
  const $ouncesModal = document.getElementById('ounces-modal');
  const $ouncesInput = document.getElementById('ounces-modal-input');
  const $ouncesError = document.getElementById('ounces-modal-error');
  const $ouncesCancel = document.getElementById('ounces-cancel');
  const $ouncesConfirm = document.getElementById('ounces-confirm');
  const $deleteModal = document.getElementById('delete-modal');
  const $deleteKeep = document.getElementById('delete-keep');
  const $deleteConfirm = document.getElementById('delete-confirm');

  let expiresAtMs = null;
  let loggedAtMs = null;

  function fmt(ms) {
    if (ms <= 0) return "00:00:00";
    const totalSec = Math.ceil(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    return [h, m, s].map((n) => String(n).padStart(2, '0')).join(':');
  }

  // Compact "3h 12m", "12m", "45s" -- used for "<duration> ago".
  function fmtCompact(ms) {
    const totalSec = Math.max(0, Math.floor(ms / 1000));
    const d = Math.floor(totalSec / 86400);
    const h = Math.floor((totalSec % 86400) / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    if (d > 0) return `${d}d ${h}h`;
    if (h > 0) return `${h}h ${m}m`;
    if (m > 0) return `${m}m ${s}s`;
    return `${s}s`;
  }

  function renderStartedAt() {
    if (loggedAtMs === null) {
      $startedAt.textContent = '';
      return;
    }
    const time = new Date(loggedAtMs).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    $startedAt.textContent = `bottle started at ${time}, ${fmtCompact(Date.now() - loggedAtMs)} ago`;
  }

  // Actual delivery of the "time's up" alert is entirely server-driven (the
  // server watches Mongo and sends a Web Push through the service worker),
  // so it fires even if this page isn't open. This function only updates
  // what's on screen right now.
  function render(remainingMs) {
    const expired = remainingMs <= 0;
    $timer.textContent = fmt(remainingMs);
    $timer.classList.toggle('expired', expired);
    $button.classList.toggle('expired', expired);
    $sub.textContent = expired
      ? "Timer's up — press the button to start a new one."
      : 'Timer running — press again anytime to reset it.';
    // Only an active (still-counting-down) bottle can be cancelled --
    // once expired it's history, and may already be mid-flight to
    // Huckleberry/push.
    $cancelButton.classList.toggle('hidden', expired || loggedAtMs === null);
  }

  function tick() {
    renderStartedAt();
    if (expiresAtMs === null) return;
    render(expiresAtMs - Date.now());
  }

  function applyStatus(status) {
    expiresAtMs = status.expiresAt ? new Date(status.expiresAt).getTime() : null;
    loggedAtMs = status.loggedAt ? new Date(status.loggedAt).getTime() : null;
    $stats.textContent = status.totalBottles === 1
      ? '1 bottle logged all-time'
      : `${status.totalBottles} bottles logged all-time`;
    renderStartedAt();
    if (expiresAtMs === null) {
      render(0);
    } else {
      tick();
    }
  }

  async function fetchStatus() {
    const res = await fetch('/api/status');
    if (!res.ok) throw new Error('status fetch failed');
    return res.json();
  }

  async function logBottle(ounces) {
    const res = await fetch('/api/bottle', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ounces }),
    });
    if (!res.ok) throw new Error('log failed');
    return res.json();
  }

  // Positive number, at most 2 decimal places -- mirrors the server's
  // parseOunces. Returns the normalized number, or null if invalid.
  function parseOuncesInput(str) {
    const n = Number(str);
    if (!Number.isFinite(n) || n <= 0 || n > 20) return null;
    const cents = Math.round(n * 100);
    if (Math.abs(cents - n * 100) > 1e-6) return null;
    return cents / 100;
  }

  // Quarter-ounce steps for the history table's Edit dropdown: 0.25 .. 9.00.
  // (The log-button modal stays a free-text field per its own spec -- this
  // is specifically the swipe-to-edit control in the history table.)
  const QUARTER_OUNCE_OPTIONS = Array.from({ length: 36 }, (_, i) => (i + 1) * 0.25);

  // --- History table --------------------------------------------------

  function fmtHistoryTime(iso) {
    const d = new Date(iso);
    const today = new Date();
    const isToday = d.toDateString() === today.toDateString();
    const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    if (isToday) return time;
    return `${d.toLocaleDateString([], { month: 'short', day: 'numeric' })}, ${time}`;
  }

  async function fetchHistory() {
    const res = await fetch('/api/history');
    if (!res.ok) throw new Error('history fetch failed');
    return res.json();
  }

  // Two-stage reveal: swipe past EDIT_WIDTH uncovers just Edit (closest to
  // the row content, since it's the last child under the actions
  // container's justify-content:flex-end -- see buildRow); swiping further,
  // past the full combined width, additionally uncovers Delete underneath.
  const EDIT_WIDTH = 72;
  const DELETE_WIDTH = 80;
  const FULL_WIDTH = EDIT_WIDTH + DELETE_WIDTH;
  let openSwipeRow = null; // the .hist-row-content currently swiped open, if any

  function closeOpenSwipe() {
    if (openSwipeRow) {
      openSwipeRow.style.transform = '';
      openSwipeRow = null;
    }
  }

  function currentTranslateX(el) {
    try {
      return new DOMMatrix(getComputedStyle(el).transform).m41;
    } catch (e) {
      return 0;
    }
  }

  // Attaches left-swipe-to-reveal-actions to one row's content element.
  // hasDelete controls whether there's a second stage to swipe into --
  // already-logged rows only ever get Edit (deleting a confirmed
  // Huckleberry entry isn't supported), so their full reveal is just
  // EDIT_WIDTH, not EDIT_WIDTH + DELETE_WIDTH.
  // Ignores mostly-vertical drags so page scrolling still works normally.
  function wireSwipe(contentEl, hasDelete) {
    const fullWidth = hasDelete ? FULL_WIDTH : EDIT_WIDTH;
    let startX = null, startY = null, startTransform = 0, dragging = false, deciding = true;

    contentEl.addEventListener('touchstart', (e) => {
      if (openSwipeRow && openSwipeRow !== contentEl) closeOpenSwipe();
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      startTransform = currentTranslateX(contentEl);
      dragging = false;
      deciding = true;
      contentEl.style.transition = 'none';
    }, { passive: true });

    contentEl.addEventListener('touchmove', (e) => {
      if (startX === null) return;
      const dx = e.touches[0].clientX - startX;
      const dy = e.touches[0].clientY - startY;
      if (deciding) {
        if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
        deciding = false;
        dragging = Math.abs(dx) > Math.abs(dy);
      }
      if (!dragging) return;
      e.preventDefault();
      const clamped = Math.min(0, Math.max(-fullWidth, startTransform + dx));
      contentEl.style.transform = `translateX(${clamped}px)`;
    }, { passive: false });

    contentEl.addEventListener('touchend', () => {
      contentEl.style.transition = '';
      if (!dragging) { startX = null; return; }
      const current = currentTranslateX(contentEl);
      let target;
      if (hasDelete && current <= -(EDIT_WIDTH + DELETE_WIDTH / 2)) {
        target = -fullWidth; // swiped past Edit and well into Delete
      } else if (current <= -(EDIT_WIDTH / 2)) {
        target = -EDIT_WIDTH; // swiped enough to reveal Edit
      } else {
        target = 0;
      }
      contentEl.style.transform = target === 0 ? '' : `translateX(${target}px)`;
      openSwipeRow = target === 0 ? (openSwipeRow === contentEl ? null : openSwipeRow) : contentEl;
      startX = null;
    });
  }

  async function patchOunces(id, ounces) {
    const res = await fetch(`/api/bottle/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ounces }),
    });
    if (!res.ok) throw new Error('ounces update failed');
  }

  async function logRowToHuckleberry(id, btn) {
    btn.disabled = true;
    btn.textContent = 'Logging…';
    try {
      const res = await fetch(`/api/bottle/${id}/log-to-huckleberry`, { method: 'POST' });
      if (!res.ok) throw new Error('log-to-huckleberry failed');
      refreshHistory();
    } catch (e) {
      btn.disabled = false;
      btn.textContent = 'Log';
    }
  }

  async function updateRowHuckleberry(id, btn) {
    btn.disabled = true;
    btn.textContent = 'Updating…';
    try {
      const res = await fetch(`/api/bottle/${id}/update-huckleberry`, { method: 'POST' });
      if (!res.ok) throw new Error('update-huckleberry failed');
      refreshHistory();
    } catch (e) {
      btn.disabled = false;
      btn.textContent = 'Update';
    }
  }

  function buildRow(row) {
    const wrap = document.createElement('div');
    wrap.className = 'hist-row';
    const hasPending = row.pendingOunces !== null;

    const actions = document.createElement('div');
    actions.className = 'hist-row-actions';
    // DOM order Delete-then-Edit: the actions container packs to the right
    // (flex-end), so Edit ends up closest to the row content -- revealed
    // first on a small swipe -- and Delete (when present) sits further
    // out, only uncovered by swiping past Edit too (see wireSwipe).
    if (!row.huckleberryLogged) {
      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'hist-delete-btn';
      deleteBtn.textContent = 'Delete';
      deleteBtn.addEventListener('click', () => {
        closeOpenSwipe();
        openDeleteModal(row.id);
      });
      actions.appendChild(deleteBtn);
    }

    const editBtn = document.createElement('button');
    editBtn.className = 'hist-edit-btn';
    editBtn.textContent = 'Edit';
    editBtn.addEventListener('click', () => {
      closeOpenSwipe();
      const select = document.createElement('select');
      select.className = 'hist-oz-edit';
      const current = hasPending ? row.pendingOunces : row.ounces;
      for (const opt of QUARTER_OUNCE_OPTIONS) {
        const el = document.createElement('option');
        el.value = String(opt);
        el.textContent = opt.toFixed(2);
        if (current !== null && Math.abs(opt - current) < 0.001) el.selected = true;
        select.appendChild(el);
      }
      ozCell.replaceChildren(select);
      select.focus();
      select.addEventListener('change', async () => {
        try {
          await patchOunces(row.id, parseFloat(select.value));
        } catch (e) { /* fall through to refresh either way */ }
        refreshHistory();
      });
    });
    actions.appendChild(editBtn);
    wrap.appendChild(actions);

    const content = document.createElement('div');
    content.className = 'hist-row-content';

    const startedCell = document.createElement('div');
    startedCell.className = 'hist-cell hist-started';
    startedCell.textContent = fmtHistoryTime(row.loggedAt);

    const ozCell = document.createElement('div');
    ozCell.className = 'hist-cell hist-oz' + (hasPending ? ' pending' : '');
    const displayOz = hasPending ? row.pendingOunces : row.ounces;
    ozCell.textContent = displayOz === null ? '—' : displayOz + (hasPending ? ' *' : '');

    const gapCell = document.createElement('div');
    gapCell.className = 'hist-cell hist-gap';
    gapCell.textContent = row.gapMs === null ? '—' : fmtCompact(row.gapMs);

    const hbCell = document.createElement('div');
    hbCell.className = 'hist-cell hist-hb';
    if (row.huckleberryLogged && hasPending) {
      const btn = document.createElement('button');
      btn.className = 'hb-update-btn';
      btn.textContent = 'Update';
      btn.addEventListener('click', () => updateRowHuckleberry(row.id, btn));
      hbCell.appendChild(btn);
    } else if (row.huckleberryLogged) {
      const label = document.createElement('span');
      label.className = 'hb-logged-label';
      label.textContent = 'Logged';
      hbCell.appendChild(label);
    } else {
      const btn = document.createElement('button');
      btn.className = 'hb-log-btn';
      btn.textContent = 'Log';
      btn.addEventListener('click', () => logRowToHuckleberry(row.id, btn));
      hbCell.appendChild(btn);
    }

    content.append(startedCell, ozCell, gapCell, hbCell);
    wrap.appendChild(content);
    wireSwipe(content, !row.huckleberryLogged);
    return wrap;
  }

  function renderHistory({ rows, avgGapMs }) {
    $avgGap.innerHTML = (avgGapMs === null ? '—' : fmtCompact(avgGapMs))
      + '<span class="label">average time between bottles</span>';

    openSwipeRow = null;
    $historyBody.replaceChildren();
    if (rows.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'hist-empty';
      empty.textContent = 'No bottles logged yet';
      $historyBody.appendChild(empty);
      return;
    }
    for (const row of rows) $historyBody.appendChild(buildRow(row));
  }

  async function refreshHistory() {
    try {
      renderHistory(await fetchHistory());
    } catch (e) {
      // Leave whatever was last rendered rather than blanking the table.
    }
  }

  // --- Ounces modal (shown on every press of the log button) ----------
  // Pre-fills with the last-used amount (server remembers it -- see
  // POST /api/bottle and PATCH /api/bottle/:id), or 3.00 if there's no
  // history yet.

  function showOuncesError(msg) {
    $ouncesError.textContent = msg;
    $ouncesInput.classList.toggle('invalid', !!msg);
  }

  async function openOuncesModal() {
    showOuncesError('');
    let prefill = 3;
    try {
      prefill = (await fetch('/api/settings').then((r) => r.json())).ounces;
    } catch (e) { /* fall back to 3 */ }
    $ouncesInput.value = prefill.toFixed(2);
    $ouncesModal.classList.remove('hidden');
    $ouncesInput.focus();
    $ouncesInput.select();
  }

  function closeOuncesModal() {
    $ouncesModal.classList.add('hidden');
  }

  $ouncesCancel.addEventListener('click', closeOuncesModal);
  $ouncesModal.addEventListener('click', (e) => {
    if (e.target === $ouncesModal) closeOuncesModal();
  });
  $ouncesInput.addEventListener('input', () => showOuncesError(''));
  $ouncesInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') $ouncesConfirm.click();
  });

  $ouncesConfirm.addEventListener('click', async () => {
    const ounces = parseOuncesInput($ouncesInput.value);
    if (ounces === null) {
      showOuncesError('Enter a number like 3 or 3.25 (up to 2 decimal places).');
      return;
    }
    $ouncesConfirm.disabled = true;
    try {
      const status = await logBottle(ounces);
      applyStatus(status);
      refreshHistory();
      closeOuncesModal();
    } catch (e) {
      showOuncesError('Could not log — check the server.');
    } finally {
      $ouncesConfirm.disabled = false;
    }
  });

  // --- Delete (history table's swipe-further action) -------------------

  let pendingDeleteId = null;

  function openDeleteModal(id) {
    pendingDeleteId = id;
    $deleteModal.classList.remove('hidden');
  }
  function closeDeleteModal() {
    $deleteModal.classList.add('hidden');
    pendingDeleteId = null;
  }

  $deleteKeep.addEventListener('click', closeDeleteModal);
  $deleteModal.addEventListener('click', (e) => {
    if (e.target === $deleteModal) closeDeleteModal();
  });
  $deleteConfirm.addEventListener('click', async () => {
    if (!pendingDeleteId) return;
    $deleteConfirm.disabled = true;
    try {
      await fetch(`/api/bottle/${pendingDeleteId}`, { method: 'DELETE' });
      refreshHistory();
      refreshFromServer();
    } catch (e) { /* history refresh will just show the row still there */ }
    $deleteConfirm.disabled = false;
    closeDeleteModal();
  });

  // --- Cancel (discard active bottle) ----------------------------------

  $cancelButton.addEventListener('click', () => {
    $cancelModal.classList.remove('hidden');
  });
  $modalKeep.addEventListener('click', () => {
    $cancelModal.classList.add('hidden');
  });
  $cancelModal.addEventListener('click', (e) => {
    if (e.target === $cancelModal) $cancelModal.classList.add('hidden');
  });
  $modalDiscard.addEventListener('click', async () => {
    $modalDiscard.disabled = true;
    try {
      const status = await fetch('/api/bottle/cancel', { method: 'POST' }).then((r) => r.json());
      applyStatus(status);
      refreshHistory();
    } catch (e) {
      $sub.textContent = 'Could not cancel — check the server.';
    } finally {
      $modalDiscard.disabled = false;
      $cancelModal.classList.add('hidden');
    }
  });

  function updateNotifBanner() {
    const supported = 'Notification' in window;
    $notifBanner.style.display = supported && Notification.permission === 'denied' ? 'block' : 'none';
  }

  // --- Push subscription plumbing -----------------------------------
  // On iOS this only works once the page has been added to the Home
  // Screen (Share -> Add to Home Screen) and opened from there; a plain
  // Safari tab can request permission but the OS won't deliver push to it.

  function urlBase64ToUint8Array(base64url) {
    const padding = '='.repeat((4 - (base64url.length % 4)) % 4);
    const base64 = (base64url + padding).replace(/-/g, '+').replace(/_/g, '/');
    const raw = atob(base64);
    return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
  }

  async function ensurePushSubscription() {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
    if (Notification.permission !== 'granted') return;
    try {
      const reg = await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if (!sub) {
        const { publicKey } = await fetch('/api/vapid-public-key').then((r) => r.json());
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(publicKey),
        });
      }
      await fetch('/api/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(sub),
      });
    } catch (e) {
      console.error('push subscription failed', e);
    }
  }

  $button.addEventListener('click', async () => {
    if ('Notification' in window && Notification.permission === 'default') {
      try { await Notification.requestPermission(); } catch (e) { /* ignore */ }
      updateNotifBanner();
      await ensurePushSubscription();
    }
    openOuncesModal();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      refreshFromServer();
      refreshHistory();
    }
  });

  async function refreshFromServer() {
    try {
      applyStatus(await fetchStatus());
    } catch (e) {
      $sub.textContent = 'Could not reach the server.';
    }
  }

  updateNotifBanner();
  refreshFromServer();
  refreshHistory();
  setInterval(tick, 1000);
  // Re-sync with the server periodically so multiple devices/tabs agree,
  // even if this tab was never backgrounded.
  setInterval(() => { refreshFromServer(); refreshHistory(); }, 30000);

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
  if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
    ensurePushSubscription();
  }
})();
</script>
</body>
</html>
